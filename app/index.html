<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lộ trình học Unity Developer từ Intern đến Senior. Tài liệu toàn diện bằng tiếng Việt cho game developer.">
  <title>Unity Developer Roadmap Vietnam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="#/" class="sidebar-logo">
          <span class="logo-icon">🎮</span>
          <div class="logo-text">
            <span class="logo-title">Unity Roadmap</span>
            <span class="logo-subtitle">Vietnam</span>
          </div>
        </a>
        <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">&times;</button>
      </div>
      <div class="sidebar-progress">
        <div class="progress-header">
          <span class="progress-label">Tiến độ tổng thể</span>
          <span class="progress-text" id="progress-text">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="total-progress"></div></div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main id="main" class="main">
      <header class="topbar" id="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <div class="topbar-actions">
          <button class="action-btn" id="search-btn" title="Tìm kiếm (Ctrl+K)" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span class="search-shortcut">Ctrl+K</span>
          </button>
          <button class="action-btn" id="theme-toggle" title="Đổi theme" aria-label="Toggle theme">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>
      <div class="content-wrapper">
        <article class="content markdown-body" id="content"></article>
      </div>
    </main>
  </div>
  <div class="search-modal hidden" id="search-modal">
    <div class="search-backdrop" id="search-backdrop"></div>
    <div class="search-dialog">
      <div class="search-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Tìm kiếm nội dung..." autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">ESC</kbd>
      </div>
      <div class="search-results" id="search-results">
        <div class="search-empty">Nhập từ khóa để tìm kiếm...</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
